name: contracts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Restore locked dependency graph
        run: dotnet restore ChatApp.Shared.slnx --locked-mode

      - name: Build
        run: dotnet build ChatApp.Shared.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ChatApp.Shared.slnx --configuration Release --no-build --no-restore

      - name: Pack once
        run: dotnet pack ChatApp.Shared.slnx --configuration Release --no-build --no-restore --output artifacts/packages

      - name: Verify package set and write checksums
        shell: pwsh
        run: |
          $expected = @(
            'ChatApp.Auth.Contracts.0.2.0.nupkg',
            'ChatApp.Contracts.Http.0.2.0.nupkg',
            'ChatApp.Protocol.Tcp.0.2.0.nupkg',
            'ChatApp.Protocol.Tcp.Json.0.2.0.nupkg'
          )
          $actual = @(Get-ChildItem artifacts/packages -Filter *.nupkg | Sort-Object Name | ForEach-Object Name)
          $difference = @(Compare-Object ($expected | Sort-Object) $actual)
          if ($difference.Count -ne 0) {
            throw "Unexpected package set: $($actual -join ', ')"
          }
          Get-ChildItem artifacts/packages -Filter *.nupkg |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } |
            Set-Content artifacts/packages/SHA256SUMS.txt

      - name: Upload immutable package candidate
        uses: actions/upload-artifact@v4
        with:
          name: chatapp-shared-${{ github.sha }}
          path: artifacts/packages/
          if-no-files-found: error
