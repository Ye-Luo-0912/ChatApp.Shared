name: contracts

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Restore locked dependency graph
        run: dotnet restore ChatApp.Shared.slnx --locked-mode

      - name: Build
        run: dotnet build ChatApp.Shared.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ChatApp.Shared.slnx --configuration Release --no-build --no-restore

      - name: Pack twice from the immutable checkout
        shell: pwsh
        run: |
          dotnet pack ChatApp.Shared.slnx --configuration Release --no-build --no-restore --output artifacts/packages-a
          dotnet pack ChatApp.Shared.slnx --configuration Release --no-build --no-restore --output artifacts/packages-b

      - name: Normalize both package sets for deterministic bytes
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/Normalize-NupkgDeterministic.ps1 -PackagesDir artifacts/packages-a
          pwsh -NoProfile -File tools/Normalize-NupkgDeterministic.ps1 -PackagesDir artifacts/packages-b

      - name: Verify package sets, deterministic bytes, and write checksums
        shell: pwsh
        run: |
          $expected = @(
            'ChatApp.Auth.Contracts.0.5.1.nupkg',
            'ChatApp.Binary.Core.0.5.1.nupkg',
            'ChatApp.Contracts.Http.0.5.1.nupkg',
            'ChatApp.Protocol.Tcp.0.5.1.nupkg',
            'ChatApp.Protocol.Tcp.Binary.0.5.1.nupkg',
            'ChatApp.Protocol.Tcp.Binary.Generator.0.5.1.nupkg',
            'ChatApp.Protocol.Tcp.Json.0.5.1.nupkg'
          )
          foreach ($directory in @('artifacts/packages-a', 'artifacts/packages-b')) {
            $actual = @(Get-ChildItem $directory -Filter *.nupkg | Sort-Object Name | ForEach-Object Name)
            $difference = @(Compare-Object ($expected | Sort-Object) $actual)
            if ($difference.Count -ne 0) {
              throw "Unexpected package set in ${directory}: $($actual -join ', ')"
            }
          }

          foreach ($name in $expected) {
            $a = (Get-FileHash (Join-Path 'artifacts/packages-a' $name) -Algorithm SHA256).Hash
            $b = (Get-FileHash (Join-Path 'artifacts/packages-b' $name) -Algorithm SHA256).Hash
            if ($a -ne $b) {
              throw "Non-deterministic package bytes for ${name}: $a != $b"
            }
          }

          New-Item -ItemType Directory -Path artifacts/packages | Out-Null
          Copy-Item artifacts/packages-a/*.nupkg artifacts/packages/
          Get-ChildItem artifacts/packages -Filter *.nupkg |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } |
            Set-Content artifacts/packages/SHA256SUMS.txt

      - name: Upload immutable package candidate
        uses: actions/upload-artifact@v4
        with:
          name: chatapp-shared-${{ github.sha }}
          path: artifacts/packages/
          if-no-files-found: error
